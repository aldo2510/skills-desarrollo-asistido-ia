name: Step 5 # Final step

on:
  push:
    paths:
      - "x-review.md"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read

env:
  REVIEW_FILE: ".github/steps/x-review.md"

jobs:
  find_exercise:
    if: ${{ !github.event.repository.is_template }}
    name: Find Exercise Issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.1

  check_final:
    name: Validate final evidence
    needs: [find_exercise]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate final evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f docs/project-analysis.md
          test -f docs/implementation-plan.md
          test -f docs/implementation-review.md
          test -f docs/test-strategy.md
          test -f tests/test_priority.py
          test -f docs/debugging-notes.md
          test -f docs/pr-description.md
          test -f x-review.md
          test "$(gh pr list --base main --state open --json number --jq 'length')" -ge 1
          python -m pip install -r requirements.txt
          pytest -q

  post_review_content:
    name: Post review
    needs: [find_exercise, check_final]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.1
      - uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/lesson-review.md
      - uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.REVIEW_FILE }}

  finish_exercise:
    needs: [find_exercise, post_review_content]
    uses: skills/exercise-toolkit/.github/workflows/finish-exercise.yml@v0.9.1
    with:
      issue-url: ${{ needs.find_exercise.outputs.issue-url }}
      exercise-title: "Desarrollo asistido por IA con GitHub Copilot"
